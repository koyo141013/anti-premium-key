
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Key</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b12;
            font-family: Arial, sans-serif;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 28px;
            text-align: center;
            background: #151520;
            border: 1px solid #292940;
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(100, 70, 255, 0.12);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 16px;
            color: #b5a3ff;
        }

        .message {
            font-size: 15px;
            line-height: 1.7;
            color: #d0d0df;
            margin-bottom: 14px;
        }

        .notice {
            margin-top: 20px;
            padding: 16px;
            background: #201d35;
            border: 1px solid #40366b;
            border-radius: 12px;
            color: #d5caff;
            font-size: 14px;
            line-height: 1.7;
        }

        .discord-button {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-top: 25px;
            padding: 15px 20px;
            background: #5865F2;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            transition: 0.2s ease;
        }

        .discord-button:hover {
            background: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.25);
        }

        .footer {
            margin-top: 22px;
            color: #77778d;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="icon">🔑</div>

        <h1>Premium Key</h1>

        <p class="message">
            Premium keys cannot currently be purchased with money.
        </p>

        <div class="notice">
            You can purchase the script for one month
            with one Discord Server Boost.
        </div>

        <a
            class="discord-button"
            href="https://discord.gg/yCQ29R9gB"
            target="_blank"
            rel="noopener noreferrer"
        >
            <span>💬</span>
            <span>Join Our Discord</span>
        </a>

        <p class="footer">
            Premium Access · Discord Community
        </p>
    </main>
</body>
</html>
